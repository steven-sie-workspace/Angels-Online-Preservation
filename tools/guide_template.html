<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Angels Online Guide</title>
<style>
  :root {
    --bg:#f4f1ea; --panel:#fffdf8; --panel2:#f0ece2; --text:#1f1c17; --muted:#6c665b;
    --line:#ddd6c7; --accent:#2f62b3; --accent-ink:#ffffff; --gold:#9a6a00; --boss:#b3361f; --good:#2e7d32;
    --row-hover:rgba(47,98,179,.07); --shadow:0 1px 2px rgba(0,0,0,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#0f1318; --panel:#161c23; --panel2:#1c242d; --text:#e7ecf2; --muted:#93a0b0;
      --line:#2a3542; --accent:#7fb2ff; --accent-ink:#0b1a2e; --gold:#e5b94f; --boss:#ff7a5c; --good:#7fd58a;
      --row-hover:rgba(127,178,255,.08); --shadow:none;
    }
  }
  :root[data-theme="dark"] {
    --bg:#0f1318; --panel:#161c23; --panel2:#1c242d; --text:#e7ecf2; --muted:#93a0b0;
    --line:#2a3542; --accent:#7fb2ff; --accent-ink:#0b1a2e; --gold:#e5b94f; --boss:#ff7a5c; --good:#7fd58a;
    --row-hover:rgba(127,178,255,.08); --shadow:none;
  }
  * { box-sizing:border-box; }
  html { color-scheme: light dark; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.45 system-ui,"Segoe UI",sans-serif; }
  :root:lang(zh-Hant) body { font-family:system-ui,"Segoe UI","Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif; }
  :root:lang(zh-Hans) body { font-family:system-ui,"Segoe UI","Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif; }
  :root:lang(zh) .f, :root:lang(zh) th, :root:lang(zh) aside h3 { text-transform:none; letter-spacing:0; }
  .wrap { max-width:1500px; margin:0 auto; padding:20px 16px 60px; }
  header.top { display:flex; flex-wrap:wrap; gap:12px 24px; align-items:flex-end; justify-content:space-between; }
  h1 { margin:0; font-size:1.55rem; letter-spacing:-.01em; }
  .sub { color:var(--muted); margin:4px 0 0; max-width:760px; }
  code, .mono { font-family:ui-monospace,"Cascadia Mono",Consolas,monospace; font-size:.92em; }
  .tools { display:flex; gap:8px; align-items:center; }
  .langs { display:flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .langs button { background:transparent; color:var(--muted); border:0; padding:6px 10px; cursor:pointer; font:inherit; min-width:40px; }
  .langs button + button { border-left:1px solid var(--line); }
  .langs button[aria-pressed="true"] { background:var(--accent); color:var(--accent-ink); }
  .themebtn { background:transparent; color:var(--muted); border:1px solid var(--line); border-radius:8px; padding:6px 10px; cursor:pointer; font:inherit; }

  nav.tabs { display:flex; gap:4px; margin:18px 0 0; border-bottom:1px solid var(--line); overflow-x:auto; }
  nav.tabs button { background:none; border:0; border-bottom:2px solid transparent; color:var(--muted); padding:10px 14px; font:inherit; font-weight:600; cursor:pointer; white-space:nowrap; }
  nav.tabs button[aria-selected="true"] { color:var(--text); border-bottom-color:var(--accent); }
  nav.tabs .n { font-weight:400; font-size:.8em; color:var(--muted); margin-left:4px; }

  .filters { display:flex; flex-wrap:wrap; gap:10px 12px; align-items:flex-end; padding:14px 0; }
  .f { display:flex; flex-direction:column; gap:4px; font-size:.75rem; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.04em; }
  .f.grow { flex:1 1 260px; }
  .f input[type=search], .f input[type=number], .f select {
    font:inherit; text-transform:none; letter-spacing:0; font-weight:400; color:var(--text); background:var(--panel);
    border:1px solid var(--line); border-radius:8px; padding:8px 10px; min-height:38px;
  }
  .f input[type=number] { width:84px; }
  .f select { min-width:150px; max-width:220px; }
  .range { display:flex; gap:6px; align-items:center; }
  .chk { display:flex; gap:6px; align-items:center; min-height:38px; font-size:.9rem; color:var(--text); text-transform:none; letter-spacing:0; font-weight:400; cursor:pointer; }
  .reset { font:inherit; background:none; border:1px solid var(--line); color:var(--text); border-radius:8px; padding:8px 12px; min-height:38px; cursor:pointer; }

  .layout { display:grid; grid-template-columns:minmax(0,1fr) 360px; gap:16px; align-items:start; }
  .bar { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:0 0 8px; color:var(--muted); font-size:.9rem; flex-wrap:wrap; }
  .pager { display:flex; gap:6px; align-items:center; }
  .pager button { font:inherit; background:var(--panel); border:1px solid var(--line); color:var(--text); border-radius:6px; padding:4px 10px; cursor:pointer; }
  .pager button:disabled { opacity:.4; cursor:default; }
  .tablebox { background:var(--panel); border:1px solid var(--line); border-radius:10px; overflow:auto; box-shadow:var(--shadow); }
  table { width:100%; border-collapse:collapse; }
  th, td { padding:7px 10px; text-align:left; border-bottom:1px solid var(--line); vertical-align:middle; }
  th { position:sticky; top:0; background:var(--panel2); font-size:.75rem; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); cursor:pointer; user-select:none; white-space:nowrap; z-index:1; }
  th.on::after { content:" ▲"; } th.on.desc::after { content:" ▼"; }
  th.nosort { cursor:default; }
  td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }
  tbody tr { cursor:pointer; }
  tbody tr:hover { background:var(--row-hover); }
  tbody tr.sel { background:var(--row-hover); box-shadow:inset 3px 0 0 var(--accent); }
  .namecell { display:flex; align-items:center; gap:10px; min-width:200px; }
  .nm { font-weight:600; }
  .small { font-size:.82rem; color:var(--muted); }
  .empty { padding:40px; text-align:center; color:var(--muted); }

  .ic { width:40px; height:40px; flex:none; border-radius:6px; background-color:var(--panel2); background-image:var(--sheet); background-repeat:no-repeat; image-rendering:pixelated; }
  .ic.none { display:grid; place-items:center; color:var(--muted); font-size:.7rem; background-image:none; }
  .ic.big { transform:scale(1.6); transform-origin:left center; margin-right:24px; }

  .idb { font:600 .85rem ui-monospace,Consolas,monospace; background:var(--panel2); color:var(--accent); border:1px solid var(--line); border-radius:6px; padding:3px 8px; cursor:pointer; white-space:nowrap; }
  .idb:hover { border-color:var(--accent); }
  .idb.ok { color:var(--good); border-color:var(--good); }
  .star { background:none; border:0; padding:2px 4px; font-size:1.15rem; line-height:1; color:var(--muted); cursor:pointer; opacity:.55; }
  .star:hover { opacity:1; }
  .star.on { color:var(--gold); opacity:1; }
  td.fav, th.fav { width:1%; padding-right:0; }
  .favbtn { font:inherit; font-size:.85rem; background:var(--panel2); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:3px 8px; cursor:pointer; white-space:nowrap; }
  .favbtn.on { color:var(--gold); border-color:var(--gold); }
  nav.tabs .fv { font-weight:400; font-size:.8em; color:var(--gold); margin-left:4px; }
  .tag { display:inline-block; font-size:.75rem; border:1px solid var(--line); border-radius:999px; padding:1px 8px; color:var(--muted); margin:1px 4px 1px 0; white-space:nowrap; }
  .tag.boss { color:var(--boss); border-color:var(--boss); }
  .tag.gold { color:var(--gold); border-color:var(--gold); }
  .lv { font-weight:700; }
  .lv.none { color:var(--muted); font-weight:400; }

  aside.detail { position:sticky; top:12px; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px; max-height:calc(100vh - 24px); overflow:auto; box-shadow:var(--shadow); }
  aside.detail h2 { margin:0; font-size:1.15rem; }
  aside .hd { display:flex; gap:12px; align-items:center; margin-bottom:10px; }
  aside dl { display:grid; grid-template-columns:auto 1fr; gap:4px 12px; margin:10px 0; font-size:.92rem; }
  aside dt { color:var(--muted); }
  aside dd { margin:0; }
  aside h3 { font-size:.75rem; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:16px 0 6px; }
  aside .desc { color:var(--muted); font-size:.9rem; margin:8px 0; }
  aside ul.links { list-style:none; margin:0; padding:0; display:grid; gap:4px; }
  aside ul.links li { display:flex; align-items:center; gap:8px; }
  aside ul.links .ic { width:40px; height:40px; }
  a.go { color:var(--accent); text-decoration:none; cursor:pointer; }
  a.go:hover { text-decoration:underline; }
  .cmd { display:flex; gap:8px; align-items:center; margin-top:8px; flex-wrap:wrap; }
  .closebtn { display:none; }
  .hint { color:var(--muted); font-size:.9rem; }

  #loading { padding:60px 0; text-align:center; color:var(--muted); }

  @media (max-width:1180px) {
    .layout { grid-template-columns:1fr; }
    aside.detail { position:fixed; left:0; right:0; bottom:0; top:auto; max-height:70vh; border-radius:14px 14px 0 0; z-index:5; box-shadow:0 -6px 24px rgba(0,0,0,.25); }
    aside.detail.idle { display:none; }
    .closebtn { display:inline-block; margin-left:auto; font:inherit; background:none; border:1px solid var(--line); color:var(--text); border-radius:8px; padding:4px 10px; cursor:pointer; }
  }
  @media (max-width:720px) { .hide-sm { display:none; } .namecell { min-width:0; } th, td { padding:6px 8px; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1 id="title">Angels Online Guide</h1>
      <p class="sub" id="sub"></p>
    </div>
    <div class="tools">
      <div class="langs" id="langs" role="group" aria-label="Language"><button type="button" data-lang="en" lang="en">EN</button><button type="button" data-lang="t" lang="zh-Hant">繁</button><button type="button" data-lang="s" lang="zh-Hans">简</button></div>
      <button class="themebtn" id="theme" type="button">Theme: auto</button>
    </div>
  </header>
  <nav class="tabs" id="tabs" role="tablist"></nav>
  <div id="loading">Loading data…</div>
  <div id="app" hidden>
    <div class="filters" id="filters"></div>
    <div class="layout">
      <section>
        <div class="bar"><span id="count"></span><div class="pager" id="pager"></div></div>
        <div class="tablebox"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>
        <div class="bar" style="padding-top:8px"><span></span><div class="pager" id="pager2"></div></div>
      </section>
      <aside class="detail idle" id="detail"></aside>
    </div>
  </div>
</div>
<script id="sheet" type="application/octet-stream">__SHEET__</script>
<script id="data" type="application/octet-stream">__DATA__</script>
<script>
(() => {
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = n => (n || n === 0) ? Number(n).toLocaleString() : "";
const PAGE = 100;

// ---------- language: en, t (繁體), s (简体)
// UI text is written once in Traditional; Simplified goes through the same
// t2s char map the data ships (D.t2s), so labels and data always agree.
const UI = {
  "Angels Online Guide": "天使之戀圖鑑",
  "sub": "查詢任何道具、寵物、怪物、NPC、地圖或任務及其ID。可搜尋名稱（英文、繁體、简体皆可）或輸入ID。點ID複製GM指令（<code>/item 123</code>），點一列查看詳細資料。",
  "Items": "道具", "Pets": "寵物", "Monsters": "怪物", "NPCs": "NPC", "Maps": "地圖", "Quests": "任務",
  "Item": "道具", "Pet": "寵物", "Monster": "怪物", "NPC": "NPC", "Map": "地圖", "Quest": "任務",
  "ID": "ID", "Pet ID": "寵物ID", "Item ID": "道具ID", "Map ID": "地圖ID", "Item Lv": "道具等級",
  "Level": "等級", "Level limit": "等級限制", "Item level limit": "道具等級限制", "Skill level": "技能等級",
  "Category": "分類", "Price": "價格", "Type": "類型", "Tier": "階段", "Element": "系別", "Quality": "品質",
  "Skill": "技能", "Skills": "技能", "Base stats": "基礎屬性", "HP": "HP", "EXP": "經驗",
  "Found in": "出現地點", "Drops": "掉落物", "Dropped by": "掉落怪物", "Gives pet": "可得寵物",
  "Items that give it": "可得此寵物的道具", "Evolves from": "進化自", "Evolves into": "可進化為",
  "Gives quests": "給予的任務", "Given by": "委託人", "Where": "地點", "Boss": "首領",
  "Search name or ID": "搜尋名稱或ID", "Search name, ID or NPC": "搜尋名稱、ID或NPC",
  "Has level limit": "有等級限制", "Dropped by monsters": "怪物會掉落", "Has an item (can /item)": "有道具（可用 /item）",
  "Boss only": "只看首領", "Found on a map": "出現在地圖上", "Has drops": "有掉落物", "Has monsters": "有怪物",
  "All": "全部", "Min": "最小", "Max": "最大", "Reset": "重設", "Close": "關閉", "Copied": "已複製",
  "‹ Prev": "‹ 上一頁", "Next ›": "下一頁 ›", "none": "無", "None.": "無。", "– (no item)": "–（無道具）",
  "e.g. wolf or 3002": "例如：狼 或 3002", "Loading data…": "資料載入中…",
  "Nothing matches. Try fewer filters.": "沒有符合的結果，請減少篩選條件。",
  "Click a row to see details, links and the GM command.": "點選一列查看詳細資料、連結和GM指令。",
  "No item hatches this pet directly. Get it by evolving the pet it comes from.": "沒有道具能直接孵出這隻寵物，請由前一階段的寵物進化取得。",
  "No spawn data recorded for this map.": "此地圖沒有出現資料。",
  "Theme": "主題", "auto": "自動", "light": "淺色", "dark": "深色",
  "map": "地圖", "pet": "寵物", "quest": "任務", "skill": "技能", "rank": "階級",
  "…and {0} more": "…還有 {0} 個", "{0} {1}": "{0} 筆", " · page {0} of {1}": " · 第 {0} / {1} 頁",
  "Favorites only": "只看收藏", "Add to favorites": "加入收藏", "In favorites": "已收藏",
  "Add to / remove from favorites": "加入／移除收藏",
  "questhint": "<code>/quest {0} 1</code> 接取任務，<code>999</code> 標記完成，<code>0</code> 移除任務。",
};
const UI_EN = {
  "sub": "Find any item, pet, monster, NPC, map or quest and its ID. Search a name or type an ID. Click an ID to copy the GM command (<code>/item 123</code>), click a row for details.",
  "questhint": "<code>/quest {0} 1</code> starts it, <code>999</code> marks it done, <code>0</code> removes it.",
};
const LANGS = {en:"en", t:"zh-Hant", s:"zh-Hans"};
let lang = "en", T2S = new Map();
try { lang = localStorage.getItem("aoguide-lang") || "en"; } catch (e) {}
if (!LANGS[lang]) lang = "en";
const conv = s => { let o = ""; for (const c of String(s)) o += T2S.get(c) || c; return o; };
// UI label (args fill {0}, {1}...)
function tr(k, ...args) {
  let s = lang === "en" ? (UI_EN[k] ?? k) : (UI[k] ?? UI_EN[k] ?? k);
  if (lang === "s") s = conv(s);
  return s.replace(/\{(\d)\}/g, (_, i) => args[i]);
}
// record field in the current language: <k>_t / <k>_s, else English
function L(r, k) {
  if (lang === "t") return r[k + "_t"] ?? r[k];
  if (lang === "s") return r[k + "_s"] ?? (r[k + "_t"] != null ? conv(r[k + "_t"]) : r[k]);
  return r[k];
}
// fixed vocabulary (item kind/group, tier, element, pet type, quest type)
let VOCAB = {};
function V(en) {
  if (lang === "en" || !en || !VOCAB[en]) return en;
  return lang === "s" ? conv(VOCAB[en]) : VOCAB[en];
}

// ---------- theme
const themes = ["auto", "light", "dark"];
let theme = "auto";
try { theme = localStorage.getItem("aoguide-theme") || "auto"; } catch (e) {}
function applyTheme() {
  if (theme === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", theme);
  $("#theme").textContent = tr("Theme") + ": " + tr(theme);
}
$("#theme").onclick = () => {
  theme = themes[(themes.indexOf(theme) + 1) % 3];
  try { localStorage.setItem("aoguide-theme", theme); } catch (e) {}
  applyTheme();
};
applyTheme();

// ---------- data
let D, COLS, CELL;
const by = {};
function icon(ic, cls = "") {
  if (ic == null || ic < 0) return `<span class="ic none ${cls}">?</span>`;
  const x = (ic % COLS) * CELL, y = Math.floor(ic / COLS) * CELL;
  return `<span class="ic ${cls}" style="background-position:-${x}px -${y}px"></span>`;
}
function copyBtn(text, label) {
  return `<button class="idb" type="button" data-copy="${esc(text)}" title="${esc(text)}">${esc(label)}</button>`;
}
function lvl(n) { return n ? `<span class="lv">${n}</span>` : `<span class="lv none">–</span>`; }
function go(tab, r) { return `<a class="go" data-go="${tab}:${r.id}">${esc(L(r, "name"))}</a>`; }
function mapName(id) { const m = by.maps.get(id); return m ? L(m, "name") : tr("Map") + " " + id; }

// ---------- tab definitions (labels are English keys, shown through tr)
const sm = s => `<span class="small">${s}</span>`;
const lvTxt = n => n ? " · Lv " + n : "";
const TABS = {
  items: {
    label: "Items",
    cols: [
      {k:"name", t:"Item", r:i => `<div class="namecell">${icon(i.ic)}<div><div class="nm">${esc(L(i, "name"))}</div><div class="small">${esc(V(i.kind))}</div></div></div>`},
      {k:"id", t:"ID", num:1, r:i => copyBtn("/item " + i.id, i.id)},
      {k:"level", t:"Level limit", num:1, r:i => lvl(i.level) + (i.skill ? `<div class="small">${tr("skill")} ${i.skill}</div>` : "")},
      {k:"group", t:"Category", cls:"hide-sm", r:i => esc(V(i.group))},
      {k:"price", t:"Price", num:1, cls:"hide-sm", r:i => fmt(i.price)},
    ],
    filters: [
      {id:"q", type:"search", label:"Search name or ID", grow:1},
      {id:"group", type:"select", label:"Category", opts:() => uniq(D.items.map(i => i.group))},
      {id:"kind", type:"select", label:"Type", opts:f => uniq(D.items.filter(i => !f.group || i.group === f.group).map(i => i.kind))},
      {id:"lv", type:"range", label:"Level limit"},
      {id:"haslv", type:"check", label:"Has level limit"},
      {id:"drop", type:"check", label:"Dropped by monsters"},
    ],
    match(i, f) {
      if (f.group && i.group !== f.group) return false;
      if (f.kind && i.kind !== f.kind) return false;
      if (f.haslv && !i.level) return false;
      if (f.drop && !i.from) return false;
      return inRange(i.level || i.skill, f.lvmin, f.lvmax);
    },
    sort: "id",
    detail(i) {
      let h = head(i.ic, L(i, "name"), V(i.kind) + " · " + V(i.group));
      h += `<div class="cmd">${copyBtn("/item " + i.id, "/item " + i.id)}${copyBtn(i.id, "ID " + i.id)}</div>`;
      h += `<dl><dt>${tr("Level limit")}</dt><dd>${i.level || tr("none")}</dd>`;
      if (i.skill) h += `<dt>${tr("Skill level")}</dt><dd>${i.skill}</dd>`;
      if (i.tree) h += `<dt>${tr("Skill")}</dt><dd>${esc(i.tree)}${i.line ? " · " + esc(i.line) : ""}${i.rank ? " · " + tr("rank") + " " + i.rank : ""}</dd>`;
      if (i.price) h += `<dt>${tr("Price")}</dt><dd>${fmt(i.price)}</dd>`;
      if (i.quality) h += `<dt>${tr("Quality")}</dt><dd>${esc(i.quality)}</dd>`;
      h += `</dl>`;
      if (L(i, "desc")) h += `<p class="desc">${esc(L(i, "desc"))}</p>`;
      if (i.pet && by.pets.get(i.pet)) {
        const p = by.pets.get(i.pet);
        h += `<h3>${tr("Gives pet")}</h3><ul class="links"><li>${icon(p.ic)}${go("pets", p)} ${sm(`${tr("pet")} ${p.id} · ${esc(V(p.tier))}`)}</li></ul>`;
      }
      if (i.from) h += `<h3>${tr("Dropped by")}</h3>` + list(i.from.map(id => by.monsters.get(id)).filter(Boolean), m => `${go("monsters", m)} ${sm("Lv " + m.lv)}`);
      return h;
    },
  },
  pets: {
    label: "Pets",
    cols: [
      {k:"name", t:"Pet", r:p => `<div class="namecell">${icon(p.ic)}<div><div class="nm">${esc(L(p, "name"))}</div><div class="small">${esc(V(p.type))}</div></div></div>`},
      {k:"id", t:"Pet ID", num:1, r:p => copyBtn(p.id, p.id)},
      {k:"items", t:"Item ID", num:1, nosort:1, r:p => p.items ? copyBtn("/item " + p.items[0], p.items[0]) + (p.items.length > 1 ? ` ${sm("+" + (p.items.length - 1))}` : "") : sm("–")},
      {k:"lv", t:"Item Lv", num:1, r:p => lvl(p.lv)},
      {k:"tier", t:"Tier", r:p => esc(V(p.tier))},

      h += `<div class="cmd">${copyBtn(`/quest ${q.id} 1`, `/quest ${q.id} 1`)}${copyBtn(q.id, "ID " + q.id)}</div>`;
      h += `<dl><dt>${tr("Level")}</dt><dd>${q.lv || "–"}</dd>${q.npc ? `<dt>${tr("Given by")}</dt><dd>${esc(L(q, "npc"))}</dd>` : ""}${q.at ? `<dt>${tr("Where")}</dt><dd>${esc(L(q, "at"))}</dd>` : ""}</dl>`;
      if (L(q, "desc")) h += `<p class="desc">${esc(L(q, "desc"))}</p>`;
      h += `<p class="hint">${tr("questhint", q.id)}</p>`;
      return h;
    },

};

// every language's text of a field, for search
function all(r, k) {
  const t = r[k + "_t"];
  return [r[k], t, r[k + "_s"] ?? (t != null ? conv(t) : null)].filter(Boolean).join(" ");
}
function plainHead(name, sub) {
  return `<div class="hd"><div><h2>${esc(name)}</h2><div class="small">${esc(sub)}</div></div><button class="closebtn" data-close>${tr("Close")}</button></div>`;
}
function head(ic, name, sub) {
  return `<div class="hd">${icon(ic, "big")}<div><h2>${esc(name)}</h2><div class="small">${esc(sub)}</div></div><button class="closebtn" data-close>${tr("Close")}</button></div>`;
}
function list(rows, fn, withIcon = true) {
  if (!rows.length) return `<p class="hint">${tr("None.")}</p>`;
  const max = 60, more = rows.length - max;
  return `<ul class="links">${rows.slice(0, max).map(r => `<li>${withIcon && "ic" in r ? icon(r.ic) : ""}<span>${fn(r)}</span></li>`).join("")}</ul>` + (more > 0 ? `<p class="small">${tr("…and {0} more", more)}</p>` : "");
}
function uniq(a) { return [...new Set(a.filter(Boolean))].sort((x, y) => String(x).localeCompare(String(y))); }
function inRange(v, lo, hi) {
  if (lo == null && hi == null) return true;
  if (!v) return false;
  return (lo == null || v >= lo) && (hi == null || v <= hi);
}

// ---------- favorites: "tab:id" keys, kept in this browser
const FAV_KEY = "aoguide-fav";
let FAV = new Set();
try { FAV = new Set(JSON.parse(localStorage.getItem(FAV_KEY) || "[]")); } catch (e) {}
const isFav = (tab, id) => FAV.has(tab + ":" + id);
function toggleFav(key) {
  if (FAV.has(key)) FAV.delete(key); else FAV.add(key);
  try { localStorage.setItem(FAV_KEY, JSON.stringify([...FAV])); } catch (e) {}
}
function favCount(tab) { let n = 0; for (const k of FAV) if (k.startsWith(tab + ":")) n++; return n; }
function star(tab, id) {
  const on = isFav(tab, id);
  return `<button class="star${on ? " on" : ""}" type="button" data-fav="${tab}:${id}" aria-pressed="${on}" title="${esc(tr("Add to / remove from favorites"))}">${on ? "★" : "☆"}</button>`;
}
function favBtn(tab, id) {
  const on = isFav(tab, id);
  return `<button class="favbtn${on ? " on" : ""}" type="button" data-fav="${tab}:${id}" aria-pressed="${on}">${on ? "★ " + tr("In favorites") : "☆ " + tr("Add to favorites")}</button>`;
}
for (const t in TABS) TABS[t].filters.splice(1, 0, {id:"fav", type:"check", label:"Favorites only"});

// ---------- state
const state = {tab:"items", f:{}, sort:{}, page:{}, sel:{}};
for (const t in TABS) { state.f[t] = {}; state.sort[t] = {k:TABS[t].sort, desc:false}; state.page[t] = 1; }

function readHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  if (p.get("tab") && TABS[p.get("tab")]) state.tab = p.get("tab");
  const f = state.f[state.tab];
  for (const [k, v] of p) if (k !== "tab" && k !== "id") f[k] = /^(lvmin|lvmax)$/.test(k) ? Number(v) : (v === "1" && k !== "q" ? true : v);
  if (p.get("id")) state.sel[state.tab] = Number(p.get("id"));
}
function writeHash() {
  const p = new URLSearchParams({tab:state.tab});
  for (const [k, v] of Object.entries(state.f[state.tab])) if (v !== "" && v != null && v !== false) p.set(k, v === true ? "1" : v);
  if (state.sel[state.tab]) p.set("id", state.sel[state.tab]);
  history.replaceState(null, "", "#" + p.toString());
}

// ---------- render
function renderTabs() {
  $("#tabs").innerHTML = Object.entries(TABS).map(([k, t]) =>
    `<button role="tab" data-tab="${k}" aria-selected="${k === state.tab}">${tr(t.label)}<span class="n">${D[k].length.toLocaleString()}</span>${favCount(k) ? `<span class="fv">★${favCount(k)}</span>` : ""}</button>`).join("");
}
function renderFilters() {
  const T = TABS[state.tab], f = state.f[state.tab];
  $("#filters").innerHTML = T.filters.map(x => {
    const label = tr(x.label);
    if (x.type === "search") return `<label class="f grow">${label}<input type="search" data-f="${x.id}" value="${esc(f[x.id] || "")}" placeholder="${esc(tr("e.g. wolf or 3002"))}" autocomplete="off"></label>`;
    // option values stay English (filters and the URL hash use them)
    if (x.type === "select") return `<label class="f">${label}<select data-f="${x.id}"><option value="">${tr("All")}</option>${x.opts(f).map(o => `<option value="${esc(o)}"${o === f[x.id] ? " selected" : ""}>${esc(V(o))}</option>`).join("")}</select></label>`;
    if (x.type === "range") return `<div class="f">${label}<div class="range"><input type="number" min="0" data-f="lvmin" placeholder="${tr("Min")}" value="${f.lvmin ?? ""}"><span>–</span><input type="number" min="0" data-f="lvmax" placeholder="${tr("Max")}" value="${f.lvmax ?? ""}"></div></div>`;
    if (x.type === "check") return `<label class="chk"><input type="checkbox" data-f="${x.id}"${f[x.id] ? " checked" : ""}> ${label}</label>`;
    return "";
  }).join("") + `<button class="reset" type="button" id="reset">${tr("Reset")}</button>`;
}
function filtered() {
  const T = TABS[state.tab], f = state.f[state.tab];
  const q = (f.q || "").trim().toLowerCase();
  const terms = q ? q.split(/\s+/) : [];
  let rows = D[state.tab].filter(r => {
    if (terms.length) {
      const hay = r._s || (r._s = searchText(state.tab, r));
      for (const t of terms) if (!hay.includes(t)) return false;
    }
    if (f.fav && !isFav(state.tab, r.id)) return false;
    return T.match(r, f);
  });
  // exact ID first
  const s = state.sort[state.tab];
  const col = T.cols.find(c => c.k === s.k) || {};
  const dir = s.desc ? -1 : 1;
  rows.sort((a, b) => {
    let av = a[s.k], bv = b[s.k];
    if (typeof av === "string") av = V(L(a, s.k));
    if (typeof bv === "string") bv = V(L(b, s.k));
    if (Array.isArray(av)) av = av.length; if (Array.isArray(bv)) bv = bv.length;
    if (col.num || typeof av === "number" || typeof bv === "number") {
      av = av || 0; bv = bv || 0;
      if (av !== bv) return (av - bv) * dir;
    } else {
      const c = String(av ?? "").localeCompare(String(bv ?? ""), LANGS[lang]);
      if (c) return c * dir;
    }
    return a.id - b.id;
  });
  if (/^\d+$/.test(q)) {
    const n = Number(q), i = rows.findIndex(r => r.id === n);
    if (i > 0) rows.unshift(rows.splice(i, 1)[0]);
  }
  return rows;
}
let current = [];
function renderTable() {
  const T = TABS[state.tab];
  current = filtered();
  const pages = Math.max(1, Math.ceil(current.length / PAGE));
  const page = state.page[state.tab] = Math.min(state.page[state.tab], pages);
  const s = state.sort[state.tab];
  $("#thead").innerHTML = `<tr><th class="fav nosort" data-sort="">★</th>` + T.cols.map(c =>
    `<th data-sort="${c.nosort ? "" : c.k}" class="${c.num ? "num " : ""}${c.cls || ""}${c.nosort ? " nosort" : ""}${s.k === c.k ? " on" + (s.desc ? " desc" : "") : ""}">${tr(c.t)}</th>`).join("") + "</tr>";
  const slice = current.slice((page - 1) * PAGE, page * PAGE);
  const sel = state.sel[state.tab];
  $("#tbody").innerHTML = slice.length ? slice.map(r =>
    `<tr data-id="${r.id}"${r.id === sel ? ' class="sel"' : ""}><td class="fav">${star(state.tab, r.id)}</td>${T.cols.map(c => `<td class="${c.num ? "num " : ""}${c.cls || ""}">${c.r(r)}</td>`).join("")}</tr>`).join("")
    : `<tr><td colspan="${T.cols.length + 1}" class="empty">${tr("Nothing matches. Try fewer filters.")}</td></tr>`;
  $("#count").textContent = tr("{0} {1}", current.length.toLocaleString(), T.label.toLowerCase()) + (current.length > PAGE ? tr(" · page {0} of {1}", page, pages) : "");
  const pg = `<button type="button" data-page="first" ${page <= 1 ? "disabled" : ""}>«</button><button type="button" data-page="prev" ${page <= 1 ? "disabled" : ""}>${tr("‹ Prev")}</button><button type="button" data-page="next" ${page >= pages ? "disabled" : ""}>${tr("Next ›")}</button><button type="button" data-page="last" ${page >= pages ? "disabled" : ""}>»</button>`;
  $("#pager").innerHTML = pages > 1 ? pg : "";
  $("#pager2").innerHTML = pages > 1 ? pg : "";
}
function renderDetail() {
  const id = state.sel[state.tab];
  const r = id && by[state.tab].get(id);
  const box = $("#detail");
  if (!r) { box.classList.add("idle"); box.innerHTML = `<p class="hint">${tr("Click a row to see details, links and the GM command.")}</p>`; return; }
  box.classList.remove("idle");
  box.innerHTML = TABS[state.tab].detail(r).replace('<div class="cmd">', '<div class="cmd">' + favBtn(state.tab, r.id));
  box.scrollTop = 0;
}
function renderAll() { renderTabs(); renderFilters(); renderTable(); renderDetail(); writeHash(); }
function applyLang() {
  document.documentElement.lang = LANGS[lang];
  for (const b of document.querySelectorAll("#langs [data-lang]")) b.setAttribute("aria-pressed", b.dataset.lang === lang);
  document.title = $("#title").textContent = tr("Angels Online Guide");
  $("#sub").innerHTML = tr("sub");
  if (!D) $("#loading").textContent = tr("Loading data…");

}
$("#langs").addEventListener("click", e => {
  const b = e.target.closest("[data-lang]"); if (!b || b.dataset.lang === lang) return;
  lang = b.dataset.lang;
  try { localStorage.setItem("aoguide-lang", lang); } catch (err) {}
  applyLang();
  if (D) renderAll();
});

// ---------- events
$("#tabs").addEventListener("click", e => {
  const b = e.target.closest("[data-tab]"); if (!b) return;
  state.tab = b.dataset.tab; renderAll();
});
let typing;
$("#filters").addEventListener("input", e => {
  const el = e.target.closest("[data-f]"); if (!el) return;
  const f = state.f[state.tab], k = el.dataset.f;
  if (el.type === "checkbox") f[k] = el.checked;
  else if (el.type === "number") f[k] = el.value === "" ? null : Number(el.value);
  else f[k] = el.value;
  if (k === "group") { f.kind = ""; }
  state.page[state.tab] = 1;
  clearTimeout(typing);
  typing = setTimeout(() => {
    if (k === "group") renderFilters();
    renderTable(); writeHash();
  }, el.type === "search" ? 150 : 0);
});
$("#filters").addEventListener("click", e => {
  if (e.target.id !== "reset") return;
  state.f[state.tab] = {}; state.page[state.tab] = 1; renderAll();
  $("#filters input[type=search]")?.focus();
});
$("#thead").addEventListener("click", e => {
  const th = e.target.closest("th[data-sort]"); if (!th || !th.dataset.sort) return;
  const s = state.sort[state.tab];
  if (s.k === th.dataset.sort) s.desc = !s.desc; else { s.k = th.dataset.sort; s.desc = th.classList.contains("num") && th.dataset.sort !== "id"; }
  renderTable();
});
function pageTo(where) {
  const pages = Math.max(1, Math.ceil(current.length / PAGE));
  const p = state.page[state.tab];
  state.page[state.tab] = where === "first" ? 1 : where === "last" ? pages : where === "prev" ? Math.max(1, p - 1) : Math.min(pages, p + 1);
  renderTable();
  window.scrollTo({top:$("#filters").offsetTop, behavior:"smooth"});
}
for (const id of ["#pager", "#pager2"]) $(id).addEventListener("click", e => { const b = e.target.closest("[data-page]"); if (b) pageTo(b.dataset.page); });
document.addEventListener("click", async e => {
  const fv = e.target.closest("[data-fav]");
  if (fv) {
    e.stopPropagation();
    toggleFav(fv.dataset.fav);
    renderTabs(); renderTable(); renderDetail();
    return;
  }
  const c = e.target.closest("[data-copy]");
  if (c) {
    e.stopPropagation();
    const text = c.dataset.copy;
    try { await navigator.clipboard.writeText(text); }
    catch (err) {
      const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); } catch (e2) {} ta.remove();
    }
    const old = c.textContent; c.classList.add("ok"); c.textContent = tr("Copied");
    setTimeout(() => { c.classList.remove("ok"); c.textContent = old; }, 900);
    return;
  }
  const g = e.target.closest("[data-go]");
  if (g) {
    const [tab, id] = g.dataset.go.split(":");
    state.tab = tab; state.sel[tab] = Number(id);
    // make the row visible: find its page under current filters, else clear them
    let rows = filtered(), i = rows.findIndex(r => r.id === Number(id));
    if (i < 0) { state.f[tab] = {}; rows = filtered(); i = rows.findIndex(r => r.id === Number(id)); }
    if (i >= 0) state.page[tab] = Math.floor(i / PAGE) + 1;
    renderAll();
    return;
  }
  if (e.target.closest("[data-close]")) { state.sel[state.tab] = null; renderDetail(); renderTable(); writeHash(); return; }
  const tr = e.target.closest("#tbody tr[data-id]");
  if (tr) {
    state.sel[state.tab] = Number(tr.dataset.id);
    for (const x of document.querySelectorAll("#tbody tr.sel")) x.classList.remove("sel");
    tr.classList.add("sel");
    renderDetail(); writeHash();
  }
});
document.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement.tagName !== "INPUT") { e.preventDefault(); $("#filters input[type=search]")?.focus(); }
  if (e.key === "Escape" && state.sel[state.tab]) { state.sel[state.tab] = null; renderDetail(); renderTable(); writeHash(); }
});

// search text: the name in every language plus the ID (built on first search)
function searchText(tab, r) {
  const extra = TABS[tab].extraSearch;
  return (all(r, "name") + " " + r.id + " " + (extra ? extra(r) : "")).toLowerCase();
}

// ---------- boot
function bytes(id) { return Uint8Array.from(atob($(id).textContent.trim()), c => c.charCodeAt(0)); }
function loadSheet() {
  // A multi-MB data: URI is too long for a CSS variable; a blob URL is short.
  try {
    const url = URL.createObjectURL(new Blob([bytes("#sheet")], {type:"image/webp"}));
    document.documentElement.style.setProperty("--sheet", `url("${url}")`);
  } catch (e) {}
}
async function load() {
  loadSheet();
  const bin = bytes("#data");
  const stream = new Blob([bin]).stream().pipeThrough(new DecompressionStream("gzip"));
  return JSON.parse(await new Response(stream).text());
}
applyLang();
load().then(data => {
  D = data; COLS = D.cols; CELL = D.cell;
  for (let i = 0; i < D.t2s.length; i += 2) T2S.set(D.t2s[i], D.t2s[i + 1]);
  VOCAB = D.vocab;
  // quest types differ per quest; take the first Chinese one seen for each
  for (const q of D.quests) if (q.type && q.type_t && !VOCAB[q.type]) VOCAB[q.type] = q.type_t;
  for (const t in TABS) by[t] = new Map(D[t].map(r => [r.id, r]));
  applyLang();
  $("#loading").hidden = true; $("#app").hidden = false;
  readHash();
  renderAll();
}).catch(err => {
  $("#loading").textContent = "Could not load the data: " + err.message + ". Open the page in a current Chrome, Edge or Firefox.";
});
})();
</script>
